{{- $draApi := include "k8s-gpu-dra-driver.draApiVersion" . -}}
{{- if and .Values.deviceClass.create $draApi }}
---
apiVersion: {{ $draApi }}
kind: DeviceClass
metadata:
  name: gpu.amd.com
spec:
  selectors:
  - cel:
      expression: "device.driver == 'gpu.amd.com'"
{{- if and .Values.deviceClass.extendedResourceName (not .Values.featureGates.AutoPartition) }}
  extendedResourceName: {{ .Values.deviceClass.extendedResourceName }}
{{- end }}
{{- if .Values.featureGates.AutoPartition }}
---
# When AutoPartition is enabled, gpu.amd.com's device pool includes fractional
# partition devices (cpx/dpx/qpx) alongside whole GPUs (spx), all matched by the
# same selector above. extendedResourceName moves to this second, spx-constrained
# class instead of staying on the general one, so a classic `amd.com/gpu` request
# (which carries no selector of its own — it's translated by the apiserver from
# resources.limits, not authored as a ResourceClaim) can only ever resolve to a
# whole GPU, never a partition fraction left over from another claim.
apiVersion: {{ $draApi }}
kind: DeviceClass
metadata:
  name: gpu.amd.com-spx
spec:
  selectors:
  - cel:
      expression: >-
        device.driver == 'gpu.amd.com' &&
        (!has(device.attributes["gpu.amd.com"].computePartition) ||
         device.attributes["gpu.amd.com"].computePartition == "spx")
  {{- with .Values.deviceClass.extendedResourceName }}
  extendedResourceName: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
