---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-gpu-dra-driver.fullname" . }}-role
  namespace: {{ include "k8s-gpu-dra-driver.namespace" . }}
rules:
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if .Values.kubeletPlugin.kmmDriverEnabled }}
# Auto-partition on a KMM-managed node reloads the driver by deleting the node's
# NodeModulesConfig so the KMM operator re-provisions it.
- apiGroups: ["kmm.sigs.x-k8s.io"]
  resources: ["nodemodulesconfigs"]
  verbs: ["get", "list", "delete"]
{{- end }}
