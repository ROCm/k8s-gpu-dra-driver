# Default values for rocm/k8s-gpu-dra-driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

allowDefaultNamespace: false

imagePullSecrets: []
image:
  repository: docker.io/rocm/k8s-gpu-dra-driver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

deviceClass:
  # -- Create the gpu.amd.com DeviceClass resource. Set to false if deploying via gpu-operator.
  create: true
  # -- Maps classic extended-resource requests to this DeviceClass.
  # Override to another name, or set "" to omit the field.
  extendedResourceName: amd.com/gpu

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

kubeletPlugin:
  # Set to true when the amdgpu kernel driver on the node is managed by Kernel
  # Module Management (KMM). This changes how the driver reloads amdgpu after an
  # auto-partition memory-mode change: on a KMM-managed node the amd-smi reload
  # is skipped (it would restore the inbox driver) and the KMM reload path is
  # used instead. When deploying via the GPU operator, the operator sets this;
  # set it here for standalone Helm deployments.
  kmmDriverEnabled: false
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  containers:
    init:
      image: docker.io/busybox:1.36
      securityContext:
        privileged: true
      resources: {}
    plugin:
      securityContext:
        privileged: true
      resources: {}
      # Port running a gRPC health service checked by a livenessProbe.
      # Set to a negative value to disable the service and the probe.
      healthcheckPort: 51515

webhook:
  enabled: false
  servicePort: 443
  containerPort: 443
  priorityClassName: "system-cluster-critical"
  strategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  containers:
    webhook:
      securityContext:
        privileged: false
      resources: {}
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

cdi:
  dynamicPath: /var/run/cdi

# Feature gates for alpha/experimental features (key: true/false), rendered into
# the FEATURE_GATES environment variable. Standard Kubernetes logging gates (e.g.
# ContextualLogging) are also accepted here.
# Example:
#   featureGates:
#     AutoPartition: true
featureGates: {}
